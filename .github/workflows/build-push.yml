# Dockerfile / requirements.txt / 다운로드 스크립트 변경 시 자동 빌드/푸시.
# Python 3.12 와 3.13 두 버전을 각각 빌드해 별도 태그로 푸시한다.
# 수동 트리거 (workflow_dispatch) 도 지원.
# 사전 설정: GitHub Secrets 에 DOCKERHUB_USERNAME, DOCKERHUB_TOKEN 등록.
name: Build and Push PyPI Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "download_packages.sh"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tag
        run: |
          PY_TAG="py$(echo '${{ matrix.python-version }}' | tr -d '.')win"
          echo "PY_TAG=${PY_TAG}" >> "$GITHUB_OUTPUT"
          echo "DATE_TAG=${PY_TAG}_$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=${PY_TAG}_latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, Python ${{ matrix.python-version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          tags: |
            joelkim/pypi:${{ steps.tag.outputs.DATE_TAG }}
            joelkim/pypi:${{ steps.tag.outputs.LATEST_TAG }}
